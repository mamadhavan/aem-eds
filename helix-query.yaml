version: 1

indices:
  pages:
    include:
      - '/**'
    target: /query-index.json
    properties:
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: |
          attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      pageHeading:
        select: main h1:first-of-type
        value: |
          textContent(el)
      introParagraph:
        select: main p:first-of-type
        value: |
          textContent(el)
  contact:
    include:
      - '/**'
    target: /free-text.json
    properties:
      content:
        select: main
        value: |
          textContent(el)            
  
      
